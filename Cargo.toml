[workspace]
members = [
    "crates/*",
]

[workspace.package]
version = "0.6.0"

authors = ["Petr Benes <w.benny@outlook.com>"]
edition = "2024"
license = "MIT"
publish = true
rust-version = "1.95.0"

homepage = "https://github.com/vmi-rs/vmi"
repository = "https://github.com/vmi-rs/vmi"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
# pedantic = { level = "warn", priority = -1 }
# restriction = { level = "warn", priority = -2 }
# only if we really want to torture ourselves:
# nursery = { level = "warn", priority = -3 }

doc_overindented_list_items = "allow"

[workspace.dependencies]
bitflags = "2"
elf = "0.8"
indexmap = "2"
kdmp-parser = "0.8"
libc = "0.2"
lru = "0.18"
memchr = "2.8"
memmap2 = "0.9"
object = "0.39"
once_cell = "1"
serde = "1"
smallvec = "1"
thiserror = "2.0"
tracing = "0.1"
zerocopy = "0.8"

# [workspace.dev-dependencies]
anyhow = "1"
hex = "0.4"
signal-hook = "0.4"
tracing-subscriber = "0.3"

#
# For release.
#

isr = "0.6.0"
isr-cache = "0.6.0"
isr-core = "0.6.0"
isr-dl-windows = "0.6.0"
isr-macros = "0.6.0"

xen = { package = "libxen", version = "0.5.0" }
kvm = { package = "libkvm", path = "../kvm" }

#
# For development.
#

# isr = { path = "../isr", version = "0.6.0" }
# isr-core = { path = "../isr/crates/isr-core", version = "0.6.0" }
# isr-dl-windows = { path = "../isr/crates/isr-dl-windows", version = "0.6.0" }
# isr-macros = { path = "../isr/crates/isr-macros", version = "0.6.0" }

# xen = { path = "../xen", package = "libxen", version = "0.5.0" }

vmi = { path = "." }
vmi-arch-amd64 = { path = "./crates/vmi-arch-amd64", version = "0.6.0" }
vmi-arch-arm64 = { path = "./crates/vmi-arch-arm64", version = "0.6.0" }
vmi-core = { path = "./crates/vmi-core", version = "0.6.0" }
vmi-driver-kdmp = { path = "./crates/vmi-driver-kdmp", version = "0.6.0" }
vmi-driver-kvm = { path = "./crates/vmi-driver-kvm", version = "0.6.0" }
vmi-driver-xen = { path = "./crates/vmi-driver-xen", version = "0.6.0" }
vmi-driver-xen-core-dump = { path = "./crates/vmi-driver-xen-core-dump", version = "0.6.0" }
vmi-macros = { path = "./crates/vmi-macros", version = "0.6.0" }
vmi-os-linux = { path = "./crates/vmi-os-linux", version = "0.6.0" }
vmi-os-windows = { path = "./crates/vmi-os-windows", version = "0.6.0" }
vmi-utils = { path = "./crates/vmi-utils", version = "0.6.0" }

# Build against the in-tree isr submodule so local isr changes are picked up.
# Patching every isr crate keeps a single consistent isr-core in the graph
# (a mix of path and registry copies would duplicate isr-core and make the
# offsets! macro's Profile type mismatch the one IsrCache returns).
[patch.crates-io]
isr = { path = "../isr" }
isr-cache = { path = "../isr/crates/isr-cache" }
isr-core = { path = "../isr/crates/isr-core" }
isr-dl = { path = "../isr/crates/isr-dl" }
isr-dl-linux = { path = "../isr/crates/isr-dl-linux" }
isr-dl-windows = { path = "../isr/crates/isr-dl-windows" }
isr-dwarf = { path = "../isr/crates/isr-dwarf" }
isr-macros = { path = "../isr/crates/isr-macros" }
isr-pdb = { path = "../isr/crates/isr-pdb" }

[profile.release]
debug = 1

################################################################################
# Root package
################################################################################

[package]
name = "vmi"
version = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
publish = { workspace = true }
rust-version = { workspace = true }

homepage = { workspace = true }
repository = { workspace = true }
description = "A modular and extensible library for Virtual Machine Introspection"
keywords = [
    "vmi",
    "introspection",
    "xen",
]
categories = ["virtualization"]

[package.metadata.docs.rs]
all-features = true
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["-Zunstable-options", "--generate-link-to-definition", "--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
indexmap = { workspace = true }
tracing = { workspace = true }
zerocopy = { workspace = true }

isr-core = { workspace = true }
isr-macros = { workspace = true }

vmi-core = { workspace = true }
vmi-arch-amd64 = { workspace = true, optional = true }
vmi-arch-arm64 = { workspace = true, optional = true }
vmi-driver-kdmp = { workspace = true, optional = true }
vmi-driver-kvm = { workspace = true, optional = true }
vmi-driver-xen = { workspace = true, optional = true }
vmi-driver-xen-core-dump = { workspace = true, optional = true }
vmi-os-linux = { workspace = true, optional = true }
vmi-os-windows = { workspace = true, optional = true }
vmi-utils = { workspace = true, optional = true }

[features]
default = []

arch-amd64 = [
    "vmi-arch-amd64",
    "vmi-utils?/arch-amd64"
]
arch-arm64 = [
    "vmi-arch-arm64",
    "vmi-utils?/arch-arm64"
]
driver-kdmp = ["vmi-driver-kdmp"]
driver-kvm = ["vmi-driver-kvm"]
driver-xen = ["vmi-driver-xen"]
driver-xen-core-dump = ["vmi-driver-xen-core-dump"]
os-linux = ["vmi-os-linux"]
os-windows = [
    "vmi-os-windows",
    "vmi-utils?/os-windows"
]
utils = [
    "vmi-utils",
    "vmi-utils/bpm",
    "vmi-utils/bridge",
    "vmi-utils/injector",
    "vmi-utils/interceptor",
    "vmi-utils/ptm",
    "vmi-utils/reactor",
    "vmi-utils/resolver",
]
utils-arm64 = [
    "vmi-utils",
    "vmi-utils/reactor-arm64",
    "arch-arm64",
    "os-windows"
]

[dev-dependencies]
anyhow = { workspace = true }
bitflags = { workspace = true }
hex = { workspace = true }
signal-hook = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zerocopy = { workspace = true }

isr = { workspace = true, features = ["cache", "pdb", "dl-windows"] }

# vmi = { workspace = true }
vmi-core = { workspace = true }
vmi-arch-amd64 = { workspace = true }
vmi-arch-arm64 = { workspace = true }
vmi-driver-kdmp = { workspace = true }
vmi-driver-xen = { workspace = true }
vmi-driver-xen-core-dump = { workspace = true }
vmi-os-linux = { workspace = true }
vmi-os-windows = { workspace = true }

kvm = { workspace = true }
xen = { workspace = true }

[[example]]
name = "basic"
path = "examples/basic.rs"
doc-scrape-examples = true

[[example]]
name = "basic-process-list"
path = "examples/basic-process-list.rs"
doc-scrape-examples = true
required-features = ["arch-amd64", "driver-xen", "os-windows"]

[[example]]
name = "kvm-basic-process-list"
path = "examples/kvm-basic-process-list.rs"
doc-scrape-examples = true
required-features = ["arch-amd64", "driver-kvm", "os-windows"]

[[example]]
name = "kvm-basic-process-list-arm64"
path = "examples/kvm-basic-process-list-arm64.rs"
doc-scrape-examples = true
required-features = ["arch-arm64", "driver-kvm", "os-windows"]

[[example]]
name = "windows-breakpoint-manager"
path = "examples/windows-breakpoint-manager.rs"
doc-scrape-examples = true
required-features = ["arch-amd64", "driver-xen", "os-windows", "utils"]

[[example]]
name = "kvm-windows-breakpoint-manager"
path = "examples/kvm-windows-breakpoint-manager.rs"
doc-scrape-examples = true
required-features = ["arch-amd64", "driver-kvm", "os-windows", "utils"]

[[example]]
name = "windows-dump"
path = "examples/windows-dump.rs"
doc-scrape-examples = true
required-features = ["arch-amd64", "driver-kdmp", "os-windows"]

[[example]]
name = "windows-recipe-messagebox"
path = "examples/windows-recipe-messagebox.rs"
doc-scrape-examples = true
required-features = ["arch-amd64", "driver-xen", "os-windows", "utils"]

[[example]]
name = "windows-recipe-writefile"
path = "examples/windows-recipe-writefile.rs"
doc-scrape-examples = true
required-features = ["arch-amd64", "driver-xen", "os-windows", "utils"]

[[example]]
name = "windows-recipe-writefile-advanced"
path = "examples/windows-recipe-writefile-advanced.rs"
doc-scrape-examples = true
required-features = ["arch-amd64", "driver-xen", "os-windows", "utils"]

[[example]]
name = "windows-reactor"
path = "examples/windows-reactor/main.rs"
doc-scrape-examples = true
required-features = ["arch-amd64", "driver-xen", "os-windows", "utils"]

[[example]]
name = "kvm-windows-reactor"
path = "examples/kvm-windows-reactor/main.rs"
doc-scrape-examples = true
required-features = ["arch-amd64", "driver-kvm", "os-windows", "utils"]

[[example]]
name = "kvm-windows-reactor-arm64"
path = "examples/kvm-windows-reactor-arm64/main.rs"
required-features = ["arch-arm64", "driver-kvm", "os-windows", "utils-arm64"]

[[example]]
